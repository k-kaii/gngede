<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pendakian Gunung Gede</title>
<style>
:root{--bg:#f2f4ee;--surf:#fff;--ink:#16241c;--mute:#5a6b60;--pri:#1f5a3c;--acc:#e0912b;--line:#d5dccf;--hero:#10301f}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,Segoe UI,Arial,sans-serif}
h1,h2{margin:0;line-height:1.1}
.page{display:none;flex:1}
.page.active{display:block}
.wrap{max-width:900px;margin:auto;padding:40px 20px}

/* halaman awal */
#home.active{display:flex;background:var(--hero);color:#f2f6f0;text-align:center}
.center{margin:auto;padding:40px 20px}
#home h1{font-size:clamp(42px,10vw,88px);letter-spacing:-.02em}
#home p{color:#c3d3c6;max-width:460px;margin:16px auto 32px}
.btn{background:var(--acc);color:#2a1a00;border:0;border-radius:99px;padding:16px 34px;font:700 18px inherit;cursor:pointer}
.btn:hover{filter:brightness(1.08)}

/* menu */
h2{font-size:clamp(26px,5vw,38px);margin-bottom:8px}
.sub{color:var(--mute);margin:0 0 24px}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin:24px 0}
.card{background:var(--surf);border:2px solid var(--line);border-radius:14px;padding:28px 22px;text-align:left;cursor:pointer;font:inherit;color:inherit}
.card b{display:block;font-size:22px;margin-bottom:4px}
.card span{color:var(--mute)}
.card:hover{border-color:var(--pri)}
.back{margin-top:24px;background:none;border:2px solid var(--line);border-radius:99px;padding:10px 22px;font:inherit;font-weight:600;color:var(--ink);cursor:pointer}
.back:hover{border-color:var(--pri)}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc)}

/* tabel */
.tbl{overflow-x:auto;background:var(--surf);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:400px}
th,td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-size:15px}
tr:last-child td{border-bottom:0}
td:last-child,th:last-child{text-align:right;font-weight:600}
td.sec{background:#1f5a3c18;color:var(--pri);font-weight:700;text-align:left!important}

/* checklist */
.prog{display:flex;align-items:center;gap:12px;margin-bottom:20px;font-weight:600}
.bar{flex:1;height:8px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--pri);transition:width .25s}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.grp{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:18px}
.grp h3{margin:0 0 10px;font-size:19px}
label{display:flex;gap:10px;align-items:flex-start;padding:5px 0;cursor:pointer}
input[type=checkbox]{width:20px;height:20px;margin-top:3px;accent-color:var(--pri);flex:none}
input:checked+span{text-decoration:line-through;color:var(--mute)}

/* kolaborator */
.collab{background:var(--hero);color:#b8cbbb;padding:20px;text-align:center}
.logos{display:flex;justify-content:center;gap:14px;margin-top:10px;flex-wrap:wrap}
.logo{position:relative;width:min(28%,110px);aspect-ratio:1/1;background:#fff;border-radius:50%;overflow:hidden;display:grid;place-items:center;color:#667;font-size:13px;border:3px solid #fff}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff}
</style>
</head>
<body>

<!-- HALAMAN 1: AWAL -->
<section class="page active" id="home">
  <div class="center">
    <h1>Gunung Gede<br>Pangrango</h1>
    <p>Panduan pendakian: sewa perlengkapan dan daftar barang wajib bawa.</p>
    <button class="btn" data-go="menu">Klik untuk lanjutkan</button>
  </div>
</section>

<!-- HALAMAN 2: MENU -->
<section class="page" id="menu">
  <div class="wrap">
    <h2>Pilih menu</h2>
    <div class="menu">
      <button class="card" data-go="harga"><b>Price list sewa barang</b><span>Harga sewa per hari</span></button>
      <button class="card" data-go="bawaan"><b>Barang yang wajib dibawa</b><span>Checklist persiapan</span></button>
    </div>
    <button class="back" data-go="home">Kembali</button>
  </div>
</section>

<!-- HALAMAN 3: PRICE LIST -->
<section class="page" id="harga">
  <div class="wrap">
    <h2>Price list sewa barang</h2>
    <p class="sub">Harga per hari (contoh, ubah sesuai tarif Anda).</p>
    <div class="tbl"><table>
      <thead><tr><th>Barang</th><th>Harga / hari</th></tr></thead>
      <tbody id="tabel"></tbody>
    </table></div>
    <button class="back" data-go="menu">Kembali ke menu</button>
  </div>
</section>

<!-- HALAMAN 4: BARANG WAJIB BAWA -->
<section class="page" id="bawaan">
  <div class="wrap">
    <h2>Barang yang wajib dibawa</h2>
    <p class="sub">Centang barang yang sudah masuk tas.</p>
    <div class="prog"><span id="pt">0 / 0</span><div class="bar"><i id="pb"></i></div></div>
    <div class="grid" id="list"></div>
    <button class="back" data-go="menu">Kembali ke menu</button>
  </div>
</section>

<!-- 3 FOTO KOLABORATOR (tampil di setiap halaman) -->
<footer class="collab">
  <small>Kolaborator</small>
  <div class="logos">
    <div class="logo"><img src="bc.jpeg" alt="Kolaborator 1"><span>Foto 1</span></div>
    <div class="logo"><img src="kai.jpeg" alt="Kolaborator 2"><span>Foto 2</span></div>
    <div class="logo"><img src="cm.jpeg" alt="Kolaborator 3"><span>Foto 3</span></div>
  </div>
</footer>

<script>
// ===== DATA HARGA SEWA (ubah sesuai tarif Anda) =====
var HARGA = {
  "Tempat tidur & berlindung": [
    ["Tenda kapasitas 2 orang", 50000], ["Tenda kapasitas 4 orang", 80000],
    ["Sleeping bag", 15000], ["Matras", 5000], ["Flysheet / tarp", 15000]],
  "Tas & perjalanan": [
    ["Carrier 60 L", 30000], ["Daypack 25 L", 15000],
    ["Trekking pole (sepasang)", 15000], ["Headlamp", 10000], ["Jas hujan / ponco", 10000]],
  "Masak & pakaian": [
    ["Kompor portable", 15000], ["Nesting (set panci)", 10000],
    ["Gas kaleng", 25000], ["Jaket gunung", 20000]]
};

// ===== DATA BARANG WAJIB BAWA =====
var BAWAAN = {
  "Pakaian": ["Baju Tracking (quick dry)","Jaket tebal / fleece","Baju ganti & kaos kaki cadangan","Celana panjang quick dry","Jas hujan","Sarung tangan & buff","Topi"],
  "Perlengkapan utama": ["Head Lamp","Hydro pack/Day Pack","Trekking pole","Sepatu gunung"],
  "Makanan & minuman": ["Air minum dua botol","Makanan berat","Mie Rebus (opsional)","Kantong sampah"],
  "Dokumen & kesehatan": ["P3K & obat pribadi","Power bank","Uang tunai"]
};

// ===== NAVIGASI ANTAR HALAMAN =====
function go(id) {
  document.querySelectorAll('.page').forEach(function (p) { p.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}
document.querySelectorAll('[data-go]').forEach(function (b) {
  b.addEventListener('click', function () { go(b.dataset.go); });
});

// ===== BUAT TABEL HARGA =====
var rp = function (n) { return 'Rp ' + n.toLocaleString('id-ID'); };
var t = '';
for (var k in HARGA) {
  t += '<tr><td colspan="2" class="sec">' + k + '</td></tr>';
  HARGA[k].forEach(function (i) { t += '<tr><td>' + i[0] + '</td><td>' + rp(i[1]) + '</td></tr>'; });
}
document.getElementById('tabel').innerHTML = t;

// ===== BUAT CHECKLIST =====
var list = document.getElementById('list'), h = '', total = 0;
for (var g in BAWAAN) {
  h += '<div class="grp"><h3>' + g + '</h3>';
  BAWAAN[g].forEach(function (x) { h += '<label><input type="checkbox"><span>' + x + '</span></label>'; total++; });
  h += '</div>';
}
list.innerHTML = h;
function update() {
  var c = list.querySelectorAll('input:checked').length;
  document.getElementById('pt').textContent = c + ' / ' + total;
  document.getElementById('pb').style.width = (c / total * 100) + '%';
}
list.addEventListener('change', update);
update();

// ===== FOTO KOLABORATOR: tampilkan teks cadangan jika foto belum ada =====
document.querySelectorAll('.logo img').forEach(function (img) {
  img.addEventListener('error', function () { img.style.display = 'none'; });
});
</script>
</body>
</html>
